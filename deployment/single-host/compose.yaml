services:
  postgres:
    image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    environment:
      POSTGRES_DB: umat
      POSTGRES_USER: umat
      POSTGRES_PASSWORD: ${UMAT_POSTGRES_PASSWORD:?set UMAT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - umat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umat -d umat"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  umat-postgres: {}
