[Service]
# GeoIP data is supplied by the official MaxMind GeoLite2 databases.
# Keep the databases outside the verified C2 runtime tree.
Environment=GEOLITE2_CITY_DB=/srv/winstdt/c2-data/GeoLite2-City.mmdb
Environment=GEOLITE2_ASN_DB=/srv/winstdt/c2-data/GeoLite2-ASN.mmdb
Environment=THREATINTEL_DB=/srv/winstdt/c2-data/threatintel.sqlite
# The pinned runtime runs idempotent seed initialization on every analysis.
# Permit SQLite (and its journal files) to update while MMDB files remain
# protected by their read-only file modes.
ReadWritePaths=/srv/winstdt/c2-data
