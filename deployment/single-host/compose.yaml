services:
  postgres:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_DB: umat
      POSTGRES_USER: umat
      POSTGRES_PASSWORD: ${UMAT_POSTGRES_PASSWORD:?set UMAT_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - umat-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umat -d umat"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  umat-postgres-18: {}
