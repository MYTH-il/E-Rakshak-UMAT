      "HeartbeatResponse":{"type":"object","additionalProperties":false,"required":["lease_expires_at","stop_requested"],"properties":{"lease_expires_at":{"type":"string","format":"date-time"},"stop_requested":{"enum":[null,"cancelled","timeout"]}}},
