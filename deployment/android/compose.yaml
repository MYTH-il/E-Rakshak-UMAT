services:
  postgres:
    image: postgres:16@sha256:${MOBSF_POSTGRES_IMAGE_DIGEST:?set MOBSF_POSTGRES_IMAGE_DIGEST}
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobsf
      POSTGRES_PASSWORD: ${MOBSF_DATABASE_PASSWORD:?set MOBSF_DATABASE_PASSWORD}
      POSTGRES_DB: mobsf
    volumes: ["mobsf-postgres:/var/lib/postgresql/data"]
    networks: [mobsf]

  djangoq:
    image: ${MOBSF_IMAGE:-umat-mobsf:6462901d}
    restart: unless-stopped
    command: /home/mobsf/Mobile-Security-Framework-MobSF/scripts/qcluster.sh
    environment: &mobsf-environment
      POSTGRES_USER: mobsf
      POSTGRES_PASSWORD: ${MOBSF_DATABASE_PASSWORD:?set MOBSF_DATABASE_PASSWORD}
      POSTGRES_DB: mobsf
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MOBSF_ASYNC_ANALYSIS: "1"
      MOBSF_ANALYZER_IDENTIFIER: emulator-5554
      MOBSF_API_KEY: ${MOBSF_API_KEY:?set MOBSF_API_KEY}
    volumes: ["mobsf-data:/home/mobsf/.MobSF"]
    depends_on: [postgres]
    networks: [mobsf]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'manage.py.qcluster' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  mobsf:
    image: ${MOBSF_IMAGE:-umat-mobsf:6462901d}
    restart: unless-stopped
    environment: *mobsf-environment
    volumes: ["mobsf-data:/home/mobsf/.MobSF"]
    ports: ["127.0.0.1:8001:8000", "127.0.0.1:1338:1337"]
    depends_on: [postgres, djangoq]
    networks: [mobsf]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  mobsf: {}

volumes:
  mobsf-postgres: {}
  mobsf-data: {}
